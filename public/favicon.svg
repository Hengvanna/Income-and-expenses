<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#f5f0e0" stroke="#1a3a6b" stroke-width="3"/>
  <!-- Inner gold ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#c9a227" stroke-width="2"/>

  <!-- Balance scale pole -->
  <rect x="31" y="22" width="2" height="20" fill="#2d5a27" rx="1"/>
  <!-- Base -->
  <rect x="26" y="41" width="12" height="2.5" fill="#2d5a27" rx="1"/>
  <!-- Top bar -->
  <rect x="20" y="22" width="24" height="2" fill="#2d5a27" rx="1"/>

  <!-- Left pan (money) -->
  <line x1="22" y1="24" x2="20" y2="32" stroke="#2d5a27" stroke-width="1.2"/>
  <ellipse cx="20" cy="33" rx="5" ry="2" fill="#c9a227"/>

  <!-- Right pan (coins) -->
  <line x1="42" y1="24" x2="44" y2="32" stroke="#2d5a27" stroke-width="1.2"/>
  <ellipse cx="44" cy="33" rx="5" ry="2" fill="#c9a227"/>

  <!-- Arrow up (growth) -->
  <polyline points="36,36 40,29 44,33" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="44,33 41,28 46,29" fill="#e74c3c"/>
</svg>